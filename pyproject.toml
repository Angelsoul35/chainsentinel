[project]
name = "chainsentinel"
version = "1.0.0"
description = "Anti-money-laundering detection on a blockchain transaction graph: FATF-typology rules, graph and behavioral features, an ML model, combined alert scoring, and an LLM-written suspicious-activity report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo David Padilla Romero" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pandas>=2.2",
  "numpy>=2.1",
  "scikit-learn>=1.5",
  "networkx>=3.4",
  "joblib>=1.4",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "httpx>=0.28"]

[project.scripts]
chainsentinel = "chainsentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chainsentinel*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
